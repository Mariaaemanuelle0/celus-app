<title>Celus App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app mobile-first em coluna única; mundo escuro preto e azul-marinho, com acento azul elétrico. Tema escuro único por escolha de marca. */
:root{
  color-scheme:dark;
  --bg:#05070C; --bg-2:#081020; --surface:#0B1322; --surface-2:#111C30; --navy:#0F2347; --navy-2:#13306A;
  --line:rgba(140,165,215,.14); --line-2:rgba(140,165,215,.28);
  --text:#E9EEF8; --muted:#8E9AB4; --accent:#4C8DFF; --accent-2:#8DB6FF; --cyan:#5ED3E8;
  --ok:#3DD68C; --warn:#F5B44A; --bad:#FF6B6B; --heart:#FF6B8B;
  --c-banheiro:#5AA9FF; --c-descanso:#A08CFF; --c-trabalho:#49C7A5; --c-ficar:#F2A65A; --c-eventos:#F07AA8; --c-imoveis:#D4B26A; --c-servicos:#5CD6D6; --c-estacionamento:#B9C6E0;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:flex;justify-content:center;min-height:100%;background:radial-gradient(900px 500px at 50% -10%,rgba(19,48,106,.55),transparent 70%),var(--bg)}
.app{width:100%;max-width:440px;min-height:100%;display:flex;flex-direction:column;position:relative}
@media (min-width:900px){.app{border-inline:1px solid var(--line)}}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(5,7,12,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 16px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em}
.logo svg{width:30px;height:30px}
.layer{margin-left:auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.layer button{border:0;background:none;color:var(--muted);font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:999px}
.layer button[aria-pressed="true"]{background:var(--accent);color:#fff}

main{flex:1;padding:20px 16px 110px;min-width:0}
nav.tabs{position:sticky;bottom:0;z-index:30;display:grid;background:rgba(8,12,22,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:7px 0 5px;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--text)}
nav.tabs button[aria-current="page"] svg{color:var(--accent-2)}
nav.tabs button[aria-current="page"]:before{content:"";position:absolute;top:-7px;width:22px;height:2px;border-radius:2px;background:var(--accent)}

h1{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.18;margin:4px 0 8px;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:15.5px;margin:28px 0 12px;letter-spacing:-.01em}
h3{font-weight:700;font-size:16px;margin:0 0 2px;line-height:1.25}
.lead{color:var(--muted);margin:0 0 16px}
.eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent-2)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.meta{font-size:13px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}

.box{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.btn{border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:13px 16px;font-weight:600;background:linear-gradient(180deg,#5B97FF,#2F6BEA);color:#fff;width:100%;font-size:15px;box-shadow:0 8px 24px -10px rgba(76,141,255,.7),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.sec,.btn.ghost{background:var(--surface-2);border-color:var(--line-2);box-shadow:none;color:var(--text)}
.btn.ghost{background:transparent}
.btn.gold{background:var(--text);color:var(--bg);box-shadow:none}
.btn.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.back{background:none;border:0;padding:2px 0;color:var(--muted);font-weight:600;margin-bottom:10px}
.coin{display:inline-flex;align-items:center;gap:4px;background:rgba(76,141,255,.12);color:var(--accent-2);border:1px solid rgba(76,141,255,.3);border-radius:8px;padding:2px 8px;font-family:var(--mono);font-weight:500;font-size:12.5px;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.chip svg{width:15px;height:15px;color:var(--muted)}
.chip[aria-pressed="true"]{background:rgba(76,141,255,.16);border-color:var(--accent);color:#fff}
.chip[aria-pressed="true"] svg{color:var(--accent-2)}
.tagc{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tagc.no{opacity:.35;text-decoration:line-through}

.hero{margin-bottom:18px}
.hero > svg{display:none}
.bubble h1{font-size:26px;margin:0 0 6px}
.bubble p{margin:0;color:var(--muted)}
.tip{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,rgba(19,48,106,.7),rgba(11,19,34,.9));border:1px solid var(--line-2);border-radius:var(--r);padding:14px}
.tip svg{width:32px;height:32px;flex:none}
.tip p{margin:0;font-size:14px;color:#C9D4EA}
.tip b{color:var(--text)}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--muted);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:12px;transition:border-color .15s,background .15s}
.cat svg{width:24px;height:24px;stroke:var(--c);fill:none;stroke-width:1.6}
.cat[aria-pressed="true"]{border-color:color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 13%,var(--surface));color:var(--text)}

.ph{--c:var(--accent);position:relative;overflow:hidden;aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;background:radial-gradient(120% 90% at 70% 10%,color-mix(in srgb,var(--c) 38%,#0B1424),#060A13 70%);border-bottom:1px solid var(--line)}
.ph:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(circle at 60% 40%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(circle at 60% 40%,#000 20%,transparent 75%)}
.ph svg.glyph{position:relative;width:24%;height:auto;stroke:color-mix(in srgb,var(--c) 55%,#fff);fill:none;stroke-width:1.2;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--c) 70%,transparent))}
.ph .tag{position:absolute;left:10px;top:10px;background:rgba(5,7,12,.65);backdrop-filter:blur(6px);border:1px solid var(--line-2);color:var(--text);font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px}
.ph .heart{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:rgba(5,7,12,.65);backdrop-filter:blur(6px);display:grid;place-items:center;color:var(--heart)}
.ph .heart svg{width:17px;height:17px}
.card{overflow:hidden}
.card .body{padding:14px}
.card .open{all:unset;display:block;cursor:pointer;width:100%}

.map{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:20px;overflow:hidden;border:1px solid var(--line-2);background:#070C17}
.map.picking{cursor:crosshair}
.map svg.base{position:absolute;inset:0;width:100%;height:100%}
.radius{position:absolute;border-radius:50%;border:1.5px solid rgba(76,141,255,.75);background:radial-gradient(circle,rgba(76,141,255,.05),rgba(76,141,255,.18));box-shadow:0 0 40px rgba(76,141,255,.25);transform:translate(-50%,-50%);pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-15px);border:0;padding:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.pin .ic{width:30px;height:30px;border-radius:50%;background:#0B1322;border:1.5px solid var(--c);display:grid;place-items:center;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent),0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}
.pin .ic svg{width:15px;height:15px;stroke:var(--c);fill:none;stroke-width:2}
.pin .pr{background:rgba(5,7,12,.85);border:1px solid var(--line-2);border-radius:6px;font-family:var(--mono);font-size:10px;padding:1px 5px;white-space:nowrap;color:var(--text)}
.pin.sel .ic{background:var(--c)}
.pin.sel .ic svg{stroke:#05070C}
.pin.far{opacity:.28}
.me{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 0 6px rgba(76,141,255,.25);pointer-events:none}
.mapbar{position:absolute;left:10px;top:10px}
.mapbar .coin{background:rgba(5,7,12,.8)}
.mapzoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.mapzoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:rgba(11,19,34,.9);font-size:18px}
.picknote{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap}
.panel{padding:12px 14px;margin-top:14px}
.panel summary{font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center}
.panel summary::-webkit-details-marker{display:none}
.panel summary:after{content:"+";margin-left:auto;font-size:20px;color:var(--muted)}
.panel[open] summary:after{content:"–"}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
select,input[type=text],input[type=number],textarea{background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 11px;width:100%;color:var(--text)}
select:focus,input:focus,textarea:focus{border-color:var(--accent);outline:none}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px;flex:none}
.listrow{display:flex;gap:12px;align-items:center;padding:8px;text-align:left;width:100%;color:var(--text)}
.listrow .ph{width:76px;flex:none;aspect-ratio:1;border:1px solid var(--line);border-radius:12px}
.listrow .ph svg.glyph{width:44%}
.listrow > div{min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.listrow .t{font-weight:700;line-height:1.25}

.fichaimg{border-radius:var(--r);overflow:hidden;border:1px solid var(--line-2)}
.fichaimg .ph{border:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-weight:500;font-size:18px}
.stat span{font-size:11px;color:var(--muted)}
.manual{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:14px;color:#C9D4EA}
.pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkg{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:12px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pkg b{font-family:var(--display);font-weight:500;font-size:17px}
.pkg[aria-pressed="true"]{border-color:var(--accent);background:rgba(76,141,255,.12)}
.extra{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.extra:last-child{border:0}
.sumline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sumline span:last-child{font-family:var(--mono)}
.sumline:last-child{border:0;font-weight:700}

.timer{background:radial-gradient(120% 100% at 50% 0%,var(--navy-2),#070C17 75%);border:1px solid var(--line-2);border-radius:22px;padding:22px 18px;text-align:center}
.timer .clock{font-family:var(--mono);font-weight:500;font-size:58px;line-height:1;letter-spacing:-.02em}
.timer .lbl{font-size:12px;color:var(--accent-2);text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono)}
.timer.over{background:radial-gradient(120% 100% at 50% 0%,#5A1A24,#0E0709 75%)}
.timer.over .lbl{color:#FFB3B3}
.hp{height:4px;background:var(--line);border-radius:99px;margin:18px 0 10px;overflow:hidden}
.hp i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--cyan))}
.alert{border:1px solid;border-radius:12px;padding:11px 13px;font-size:14px}
.alert.warn{border-color:rgba(245,180,74,.45);background:rgba(245,180,74,.08)}
.alert.bad{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.08)}
.alert.ok{border-color:rgba(61,214,140,.45);background:rgba(61,214,140,.08)}
.code{font-family:var(--mono);font-size:32px;letter-spacing:.22em;color:var(--accent-2)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.demo{font-size:12px;color:var(--muted);border:1px dashed var(--line-2);border-radius:10px;padding:7px 10px}

.stars{display:flex;gap:4px}
.stars button{border:0;background:none;padding:2px;color:#26324A}
.stars button.on{color:var(--accent-2)}
.stars svg{width:30px;height:30px}
.axis{padding:14px}
.axis p{margin:2px 0 10px;font-size:13px;color:var(--muted)}

.avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--navy-2),var(--surface));border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:18px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dream{padding:0;overflow:hidden;text-align:left;color:var(--text)}
.dream .ph{aspect-ratio:4/3}
.dream .t{padding:10px;font-size:13px;font-weight:700}
.status{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.06em;border:1px solid}
.status.pend{color:var(--warn);border-color:rgba(245,180,74,.4)}
.status.apr{color:var(--ok);border-color:rgba(61,214,140,.4)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px}
.kpi b{display:block;font-family:var(--mono);font-weight:500;font-size:18px}
.kpi span{font-size:11.5px;color:var(--muted)}
.review{border-bottom:1px solid var(--line);padding:12px 0;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:22px 16px;border:1px dashed var(--line-2);border-radius:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg{width:36px;height:36px}
.flabel{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13.5px}
.uploads{display:flex;gap:8px;flex-wrap:wrap}
.uploads img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line-2)}
.exrow{display:grid;grid-template-columns:1fr 90px 40px;gap:6px;align-items:center}
.exrow button{height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--surface-2);color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);border:1px solid var(--accent);box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* feed */
.post{overflow:hidden}
.phead{display:flex;gap:10px;align-items:center;padding:12px 14px}
.pav{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--c) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 60%,transparent);color:var(--text)}
.pav svg{width:22px;height:22px}
.phead b{display:block;font-size:14px;line-height:1.2}
.ptext{padding:12px 14px 4px;font-size:14.5px;color:#D3DCEE;margin:0}
.pact{display:flex;align-items:center;gap:4px;padding:6px 8px 10px}
.pact .ab{background:none;border:0;display:inline-flex;align-items:center;gap:6px;padding:8px;border-radius:8px;color:var(--muted);font-family:var(--mono);font-size:12.5px}
.pact .ab svg{width:19px;height:19px}
.pact .ab[aria-pressed="true"]{color:var(--heart)}
.dica{padding:18px 16px;background:radial-gradient(120% 120% at 100% 0%,rgba(76,141,255,.28),transparent 60%),linear-gradient(160deg,var(--navy),var(--surface));border:1px solid var(--line-2);border-radius:var(--r)}
.dica h3{font-family:var(--display);font-weight:500;font-size:17px;margin:8px 0 6px}
.dica p{margin:0 0 14px;color:#C9D4EA;font-size:14px}
.screen{min-width:0}
.wl .sumline:last-child{font-weight:inherit}
.walletcard{padding:18px;border-radius:18px;background:radial-gradient(120% 120% at 100% 0%,rgba(127,176,255,.35),transparent 55%),linear-gradient(150deg,#13306A,#0B1322 75%);border:1px solid rgba(127,176,255,.35)}
.walletmini{width:100%;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:linear-gradient(150deg,#13306A,#0B1322 80%);border:1px solid rgba(127,176,255,.3);color:var(--text)}
.chatlist{display:flex;flex-direction:column;gap:12px;margin-top:16px;padding-bottom:8px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg .pav{width:30px;height:30px;font-size:11px}
.bub{background:var(--surface-2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:14.5px;min-width:0}
.msg.mine .bub{background:linear-gradient(180deg,#2F6BEA,#2457C9);border-color:transparent;border-radius:14px 14px 4px 14px}
.bub .mh{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:2px}
.msg.mine .bub .mh{color:#CFE0FF}
.bub .mh b{color:var(--text);font-size:12.5px}
.mden{background:none;border:0;color:var(--muted);font-size:11px;padding:0;margin-left:auto;text-decoration:underline}
.chatbar{position:sticky;bottom:76px;display:flex;gap:8px;margin-top:12px;padding:8px;border-radius:14px;background:rgba(11,19,34,.95);border:1px solid var(--line-2);backdrop-filter:blur(10px)}
.chatbar input{border:0;background:transparent}
.dotlive{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 0 3px rgba(61,214,140,.2)}
/* stories */
.stories{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin-bottom:18px}
.stories::-webkit-scrollbar{display:none}
.sto{flex:none;width:68px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text);font-size:11.5px}
.sto .ring{width:62px;height:62px;border-radius:50%;padding:2.5px;background:conic-gradient(from 200deg,var(--cyan),var(--accent),#7A5CFF,var(--cyan))}
.sto .ring.seen{background:var(--line-2)}
.sto .in{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--bg);display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 60% 30%,color-mix(in srgb,var(--c) 45%,#0B1424),#060A13)}
.sto .in svg{width:24px;height:24px;stroke:color-mix(in srgb,var(--c) 60%,#fff);fill:none;stroke-width:1.6}
.sto .in img{width:100%;height:100%;object-fit:cover}
.sto span.n{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.sto.add .ring{background:var(--line-2)}
.viewer{position:fixed;inset:0;z-index:90;background:#000;display:flex;justify-content:center}
.viewer .vin{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column}
.viewer .bars{display:flex;gap:4px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0}
.viewer .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.25)}
.viewer .bars i.on{background:#fff}
.viewer .vh{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff}
.viewer .vh .x{margin-left:auto;background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:4px 8px}
.viewer .media{position:relative;flex:1;margin:0 8px;border-radius:16px;overflow:hidden;display:grid;place-items:center}
.viewer .media img{width:100%;height:100%;object-fit:cover}
.viewer .media .ph{position:absolute;inset:0;aspect-ratio:auto;border:0}
.viewer .media .ph svg.glyph{width:30%}
.viewer .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 16px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:16px;font-weight:600}
.viewer .tapl,.viewer .tapr{position:absolute;top:0;bottom:0;width:35%;background:none;border:0}
.viewer .tapl{left:0}.viewer .tapr{right:0}
.viewer .vf{display:flex;gap:8px;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px))}
/* segurança */
.safecell{position:absolute;pointer-events:none;border:1px solid rgba(255,255,255,.04)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sema{position:absolute;right:10px;top:10px;z-index:5;width:30px;padding:6px 0;border-radius:10px;background:#05070C;border:1px solid var(--line-2);display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.sema i{width:14px;height:14px;border-radius:50%;background:var(--c);opacity:.18}
.sema i.on{opacity:1;box-shadow:0 0 10px var(--c),0 0 2px var(--c)}
.semapop{position:absolute;right:48px;top:10px;z-index:6;width:218px;padding:12px;border-radius:14px;background:rgba(11,19,34,.97);border:1px solid var(--line-2);box-shadow:0 12px 30px rgba(0,0,0,.6)}
.semapop .x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:0 2px}
.semaopt{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:11px;font-weight:600}
.semaopt i{width:18px;height:18px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.mapzoom button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.semaforo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.semaforo button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);text-align:center}
.semaforo i{width:34px;height:34px;border-radius:50%;background:var(--c);opacity:.35;transition:opacity .15s,box-shadow .15s}
.semaforo b{font-size:14px}
.semaforo span{font-size:11.5px;color:var(--muted);line-height:1.3}
.semaforo button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.semaforo button[aria-pressed="true"] i{opacity:1;box-shadow:0 0 18px var(--c)}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl button{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-weight:600}
.lvl button i{width:12px;height:12px;border-radius:50%;flex:none}
.lvl button[aria-pressed="true"]{border-color:var(--accent);background:rgba(76,141,255,.12)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;font-size:12px}
.slot b{display:block;font-size:13px;margin:4px 0 2px}
.slot.now{border-color:var(--accent)}
.slot .bar{height:4px;border-radius:2px;margin-top:6px}
.live{position:sticky;bottom:78px;z-index:25;margin-top:20px;width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;border:1px solid rgba(76,141,255,.5);background:rgba(15,35,71,.92);backdrop-filter:blur(10px);color:var(--text);font-weight:600;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.live .sp{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(61,214,140,.2);flex:none}
@media (prefers-reduced-motion: no-preference){
  .screen{animation:rise .25s ease-out}
  @keyframes rise{from{opacity:.6;transform:translateY(5px)}}
  .me{animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,141,255,.6)}100%{box-shadow:0 0 0 18px rgba(76,141,255,0)}}
}

/* ================= sensação de segurança ================= */
const SLOTS = {madrugada:'Madrugada', manha:'Manhã', tarde:'Tarde', noite:'Noite'};
const slotNow = ()=>{const h=new Date().getHours(); return h<6?'madrugada':h<12?'manha':h<18?'tarde':'noite';};
const CELL = 0.8, NCX = 4, NCY = 5, MIN_RELATOS = 3;
const LVL = {3:['Verde','Tranquilo, me sinto seguro','var(--ok)'],2:['Amarelo','Atenção','var(--warn)'],1:['Vermelho','Não me sinto seguro aqui','var(--bad)']};
const SAFE = {};
(function seed(){
  let x=7; const r=()=>{x=(x*16807)%2147483647; return x/2147483647;};
  const base=[[2.8,2.7,2.6,2.4],[2.9,2.9,2.7,2.5],[2.7,2.9,2.8,2.4],[2.5,2.7,2.6,2.2],[2.3,2.6,2.4,2.0]];
  const d={manha:.1,tarde:0,noite:-.35,madrugada:-.65}, k={manha:1,tarde:1,noite:.6,madrugada:.3};
  for(let cy=0;cy<NCY;cy++) for(let cx=0;cx<NCX;cx++) for(const sl in SLOTS){
    const n=Math.floor(r()*14*k[sl]); const avg=Math.max(1,Math.min(3,base[cy][cx]+d[sl]+(r()-.5)*.2));
    SAFE[cx+'_'+cy+'_'+sl]={n, sum:avg*n};
  }
})();
const cellOf = p=>[Math.min(NCX-1,Math.max(0,Math.floor(p.x/CELL))), Math.min(NCY-1,Math.max(0,Math.floor(p.y/CELL)))];
function safety(p, sl){
  const [cx,cy]=cellOf(p), d=SAFE[cx+'_'+cy+'_'+sl]||{n:0,sum:0};
  if(d.n<MIN_RELATOS) return {lvl:'poucos', label:'Sem dados', n:d.n, color:'var(--line-2)'};
  const a=d.sum/d.n;
  if(a>=2.5) return {lvl:'verde', label:'Verde', n:d.n, avg:a, color:'var(--ok)'};
  if(a>=1.9) return {lvl:'amarelo', label:'Amarelo', n:d.n, avg:a, color:'var(--warn)'};
  return {lvl:'vermelho', label:'Vermelho', n:d.n, avg:a, color:'var(--bad)'};
}

/* ================= regra de cobrança ================= */
const CARENCIA_MIN = 5;
function cobranca(b, usadoMin){
  const contratado = b.pacote.h*60 + b.extensoes*60;
  const excedente = Math.max(0, usadoMin - contratado);
  const cobravel = Math.max(0, excedente - CARENCIA_MIN);
  const teto = 2*b.precoHora*b.pessoas;
  const bruta = cobravel*(b.precoHora/60)*b.pessoas;
  const multa = Math.min(bruta, teto);
  const total = b.pacote.p*b.pessoas + b.extrasTotal + b.extensoes*b.precoHora*b.pessoas + multa;
  return {contratado, excedente, cobravel, multa, teto, bateuTeto:cobravel>0 && bruta>=teto, total};
}

function subOk(l){
  const own = Object.keys(CATS[l.cat].subs).filter(s=>state.subs.has(s));
  return own.length===0 || own.includes(l.sub);
}
function profOk(l){
  if(l.cat!=='servicos') return true;
  const own = Object.keys(PROF[l.sub]||{}).filter(p=>state.profs.has(p));
  return own.length===0 || own.includes(l.prof);
}
function filtered(){
  return visible().filter(l=>
    (state.cats.size===0||state.cats.has(l.cat)) && subOk(l) && profOk(l) &&
    [...state.amen].every(a=>l.amen.includes(a)) &&
    (!state.minM2||(l.m2||0)>=state.minM2) && (l.cap>=state.minCap||l.cat==='servicos') &&
    nota(l)>=state.minRating && (l.cat==='imoveis'||basePrice(l)<=state.maxPrice)
  ).sort((a,b)=>dist(a)-dist(b));
}
function proj(p){ const c=state.center,z=state.zoom; return {x:((c.x+(p.x-c.x)*z)/MAPW)*100, y:((c.y+(p.y-c.y)*z)/MAPH)*100}; }

/* timer */
let clock=null,last=0;
function startClock(){ clearInterval(clock); last=Date.now(); clock=setInterval(()=>{const b=state.active; if(!b) return clearInterval(clock);
  const now=Date.now(); b.usadoMin+=(now-last)/1000*state.speed/60; last=now; if(state.tab==='uso'&&state.param===b.id) paint(b); else paintLive();},250); }
const mmss = m=>{const s=Math.max(0,Math.round(m*60)),h=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;return (h?h+':'+String(mm).padStart(2,'0'):mm)+':'+String(ss).padStart(2,'0');};
S.uso = id=>{
  const b=state.bookings.find(x=>x.id===id);
  return `<div class="eyebrow">Em uso agora</div><h1>${esc(b.listing.titulo)}</h1>
  <div class="timer" id="timer"><div class="lbl" id="tL">Tempo restante</div><div class="clock" id="tC">--:--</div><div class="hp"><i id="tB" style="width:100%"></i></div><div class="lbl num" id="tS"></div></div>
  <div id="tA" style="margin-top:12px"></div>
  <div style="margin-top:12px"><button class="btn gold" id="estender">Estender +1h por ${brl(b.precoHora*b.pessoas)}</button></div>
  <div class="box" style="padding:10px 14px;margin-top:14px" id="tConta"></div>
  <div class="box" style="padding:14px;margin-top:14px">${acessoBox(b)}</div>
  <div style="margin-top:14px"><button class="btn ghost" id="encerrar">Encerrar e sair</button></div>
  <div class="row demo" style="margin-top:14px"><span>Velocidade do teste</span><span class="sp"></span><span class="seg">${[[1,'Real'],[60,'1 s = 1 min'],[300,'1 s = 5 min']].map(([v,t])=>`<button data-speed="${v}" aria-pressed="${state.speed===v}">${t}</button>`).join('')}</span></div>`;
};
function paintLive(){ const b=state.active, el=$('#liveT'); if(!b||!el) return; const c=cobranca(b,b.usadoMin), r=c.contratado-b.usadoMin; el.textContent=(r<0?'+':'')+mmss(Math.abs(r)); }
function paint(b){
  const c=cobranca(b,b.usadoMin), rest=c.contratado-b.usadoMin; if(!$('#timer')) return;
  $('#timer').classList.toggle('over',rest<0);
  $('#tL').textContent = rest>=0?'Tempo restante':(c.cobravel>0?'Excedente (cobrando)':'Tolerância');
  $('#tC').textContent = rest>=0? mmss(rest) : '+'+mmss(-rest);
  $('#tB').style.width = Math.max(0,Math.min(100,rest/c.contratado*100))+'%';
  $('#tS').textContent = `Contratado ${pkgLabel(c.contratado/60)} · início ${new Date(b.inicio).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  let a='';
  if(rest<=20&&rest>0) a=`<div class="alert warn"><b>Faltam ${Math.ceil(rest)} minutos.</b> Quer mais tempo? Estenda com um toque.</div>`;
  else if(rest<=0&&c.cobravel===0) a=`<div class="alert warn"><b>Seu tempo acabou.</b> ${Math.max(0,Math.ceil(CARENCIA_MIN-c.excedente))} min de tolerância antes da cobrança por minuto.</div>`;
  else if(c.cobravel>0) a=`<div class="alert bad"><b>Cobrança por minuto ativa.</b> ${c.bateuTeto?'Chegou ao teto de 2× o valor da hora. Não cobramos mais que isso.':'Teto: '+brl(c.teto)+'.'}</div>`;
  $('#tA').innerHTML=a;
  $('#tConta').innerHTML=`<div class="sumline"><span>Pacote ${pkgLabel(b.pacote.h)}${b.pessoas>1?' × '+b.pessoas:''}</span><span>${brl(b.pacote.p*b.pessoas)}</span></div>
   ${b.extrasTotal?`<div class="sumline"><span>Extras</span><span>${brl(b.extrasTotal)}</span></div>`:''}
   ${b.extensoes?`<div class="sumline"><span>Extensões (${b.extensoes}h)</span><span>${brl(b.extensoes*b.precoHora*b.pessoas)}</span></div>`:''}
   <div class="sumline"><span>Excedente (${Math.round(c.cobravel)} min)</span><span>${brl(c.multa)}</span></div>
   <div class="sumline"><span>Total até agora</span><span>${brl(c.total)}</span></div>`;
}

  <div class="stack">${RESGATES.filter(r=>r.lid&&mine.some(l=>l.id===r.lid)).map(r=>`<div class="box" style="padding:12px 14px;display:flex;gap:12px;align-items:center"><div class="sp" style="min-width:0"><b style="font-size:14.5px">${esc(r.nome)}</b><div class="hint">${esc(listings.find(l=>l.id===r.lid).titulo)}</div></div><span class="coin">${fmtF(r.custo)} celus</span></div>`).join('')}
   <form class="box" id="benForm" style="padding:12px 14px;display:grid;grid-template-columns:1fr 90px;gap:8px">
    <select id="benL" style="grid-column:1/-1" aria-label="Espaço">${mine.filter(l=>l.status==='aprovado').map(l=>`<option value="${l.id}">${esc(l.titulo)}</option>`).join('')}</select>
    <input type="text" id="benN" placeholder="Ex.: água de coco de brinde" aria-label="Benefício"><input type="number" id="benC" min="5" value="30" aria-label="Custo em celus">

      <span class="t">${esc(x.autor)}</span><span class="meta">${esc(x.legenda||'Sem legenda')}</span><span class="hint num">${agoTxt(x.criado)} · ${leftTxt(x.criado)}</span>
      ${denunciado(x.id)?'<span class="status pend">Em análise</span>':`<button class="btn sm ghost" data-oden="${x.id}">Denunciar</button>`}</div></div>`;}).join('')}</div>`

B.painel = ()=>{
  $('#benForm')&&($('#benForm').onsubmit=e=>{e.preventDefault(); const n=$('#benN').value.trim(), c=+$('#benC').value, lid=+$('#benL').value; if(!n||!c||!lid) return toast('Preencha o benefício e o custo');
    const l=listings.find(x=>x.id===lid); RESGATES.push({id:'u'+Date.now(),grupo:'local',lid,nome:n,desc:'Em '+l.titulo+'.',custo:c}); toast('Benefício publicado'); render();});
  $$('[data-tabgo]').forEach(b=>b.onclick=()=>go(b.dataset.tabgo));
  const g={}; stories.forEach(x=>g['o'+x.id]=[x]); bindStories(g);
  $$('[data-oden]').forEach(b=>b.onclick=()=>{ const sid=+b.dataset.oden;
    $('#odenBox').innerHTML=`<div class="box" style="padding:14px;margin-top:12px"><b>Motivo da denúncia</b><div class="stack" style="gap:6px;margin-top:10px">${MOTIVOS.map(m=>`<button class="btn sm ghost" data-omot="${m}" style="width:100%;text-align:left">${m}</button>`).join('')}</div></div>`;
    $('#odenBox').scrollIntoView({block:'center'});
    $$('[data-omot]').forEach(x=>x.onclick=()=>{denunciar(sid,'Anfitrião',x.dataset.omot); toast('Denúncia enviada. A curadoria Celus analisa'); render();}); });
};

let draft = {cat:'descanso', sub:'rede', titulo:'Varanda com rede e ducha', bairro:'Vila do Farol', desc:'Varanda coberta com duas redes e ducha externa.',
  p:[{h:1,p:12},{h:3,p:30},{h:6,p:55}], valor:250, m2:15, cap:2, porPessoa:false, amen:new Set(['ventilador']), extras:[{n:'Toalha',p:3}],
  acesso:'responsavel', resp:'', manual:'Ao sair, recolha as toalhas e feche o portão.', fotos:[]};
S.anunciar = ()=>{
  const c=CATS[draft.cat]; if(!c.subs[draft.sub]) draft.sub=Object.keys(c.subs)[0]; if(draft.cat==='servicos'&&!(PROF[draft.sub]||{})[draft.prof]) draft.prof=Object.keys(PROF[draft.sub])[0];
  let preco='';
  if(c.preco==='pacote') preco=`<div><div class="flabel">Pacotes de tempo<span class="hint">Horas em cima, preço em reais embaixo. Dê desconto nos pacotes maiores.</span></div>
    <div class="pkgs" style="margin-top:8px">${draft.p.map((x,i)=>`<div class="stack" style="gap:4px"><input type="number" id="ph${i}" min="0.25" step="0.25" value="${x.h}" aria-label="Horas do pacote ${i+1}"><input type="number" id="pp${i}" min="0" value="${x.p}" aria-label="Preço do pacote ${i+1}"></div>`).join('')}</div>
    <label class="row hint" style="margin-top:8px"><input type="checkbox" id="aPP" ${draft.porPessoa?'checked':''}> Cobrar por pessoa</label></div>`;
  else preco=`<label class="flabel">${{diaria:'Diária (R$)',valor:'Valor (R$)',servico:'Preço por hora ou por atendimento (R$)'}[c.preco]}<input type="number" id="aValor" min="1" value="${draft.valor}"></label>`;
  const espaco = draft.cat!=='servicos';
  return `<div class="eyebrow">Rentabilizar</div><h1>Anuncie seu espaço</h1><p class="lead">A equipe Celus revisa tudo antes de aparecer no mapa.</p>
  <form id="fA" class="stack">
   <div><div class="flabel" style="margin-bottom:8px">Categoria</div><div class="cats">${Object.entries(CATS).map(([k,x])=>`<button type="button" class="cat" style="--c:var(--c-${k})" data-acat="${k}" aria-pressed="${draft.cat===k}">${ic(x.icon)}${x.curto||x.nome}</button>`).join('')}</div></div>
   <div><div class="flabel" style="margin-bottom:8px">${draft.cat==='servicos'?'Nicho':'Tipo'}</div><div class="chips">${Object.entries(c.subs).map(([s,n])=>`<button type="button" class="chip" data-asub="${s}" aria-pressed="${draft.sub===s}">${ic(s)}${n}</button>`).join('')}</div></div>
   ${draft.cat==='servicos'?`<div><div class="flabel" style="margin-bottom:8px">Profissão</div><div class="chips">${Object.entries(PROF[draft.sub]).map(([p,n])=>`<button type="button" class="chip" data-aprof="${p}" aria-pressed="${draft.prof===p}">${n}</button>`).join('')}</div></div>`:''}
   <label class="flabel">${draft.cat==='servicos'?'Seu nome e profissão':'Título'}<input type="text" id="aT" value="${esc(draft.titulo)}"></label>
   <label class="flabel">Bairro<input type="text" id="aB" value="${esc(draft.bairro)}"></label>
   <label class="flabel">Descrição<textarea id="aD" rows="3">${esc(draft.desc)}</textarea></label>
   <div class="flabel">Fotos<span class="hint">Mínimo 1, ideal 3 ou mais.</span><input type="file" id="aF" accept="image/*" multiple><div class="uploads" id="prev">${draft.fotos.map(s=>`<img src="${s}" alt="">`).join('')}</div></div>
   ${preco}
   ${espaco?`<div class="grid2"><label class="flabel">Metragem (m²)<input type="number" id="aM2" min="1" value="${draft.m2}"></label><label class="flabel">Capacidade<input type="number" id="aCap" min="1" value="${draft.cap}"></label></div>
   <div><div class="flabel" style="margin-bottom:8px">O que tem no local<span class="hint">É o que vem junto com o anúncio. Para alugar o banheiro separado, crie outro anúncio na categoria Banheiro.</span></div><div class="checks">${Object.entries(AMEN).map(([k,n])=>`<label><input type="checkbox" data-aamen="${k}" ${draft.amen.has(k)?'checked':''}>${n}</label>`).join('')}</div></div>
   <div><div class="flabel" style="margin-bottom:8px">Extras que você oferece<span class="hint">Toalha, utensílios, café, caixa de som. Cada um com seu preço em reais.</span></div>
     <div class="stack" style="gap:8px">${draft.extras.map((e,i)=>`<div class="exrow"><input type="text" data-exn="${i}" value="${esc(e.n)}" placeholder="Item" aria-label="Nome do extra"><input type="number" data-exp="${i}" min="0" value="${e.p}" aria-label="Preço do extra"><button type="button" data-exdel="${i}" aria-label="Remover extra">×</button></div>`).join('')}
     <button type="button" class="btn sm ghost" id="exadd" style="align-self:flex-start">+ Adicionar extra</button></div></div>
   <label class="flabel">Como a pessoa entra<select id="aAc">${Object.entries(ACESSO).map(([k,v])=>`<option value="${k}" ${draft.acesso===k?'selected':''}>${v}</option>`).join('')}</select></label>
   ${draft.acesso==='responsavel'?`<label class="flabel">Responsável local (nome e contato)<input type="text" id="aR" value="${esc(draft.resp)}" placeholder="Ex.: Ana, vizinha da casa 3"></label>`:''}`:''}
   <label class="flabel">${espaco?'Manual de bons modos':'Como você trabalha'}<textarea id="aMan" rows="3">${esc(draft.manual)}</textarea></label>
   ${!espaco?`<div class="tip">${masc(28)}<p><b>Você trabalha como freelancer.</b> Depois de 12 h seguidas disponível no app, ele pausa seu perfil por 6 h. A comissão da Celus é de 15% por chamado, e você emite nota sobre o que ganhar.</p></div>`:''}
   ${espaco?`<div class="tip">${masc(48)}<p>Regra da casa: nenhum espaço pode deixar duas pessoas desconhecidas sozinhas num ambiente íntimo fechado. Prefira acesso independente.</p></div>`:''}
   <button class="btn" type="submit">Enviar para aprovação</button>
  </form>`;
};
function readDraft(){
  const v=id=>$(id)?.value;
  draft.titulo=v('#aT')??draft.titulo; draft.bairro=v('#aB')??draft.bairro; draft.desc=v('#aD')??draft.desc; draft.manual=v('#aMan')??draft.manual;
  if($('#ph0')) draft.p=[0,1,2].map(i=>({h:+v('#ph'+i)||1,p:+v('#pp'+i)||0})); if($('#aPP')) draft.porPessoa=$('#aPP').checked;
  if($('#aValor')) draft.valor=+v('#aValor'); if($('#aM2')) draft.m2=+v('#aM2'); if($('#aCap')) draft.cap=+v('#aCap')||1;
  if($('#aAc')) draft.acesso=v('#aAc'); if($('#aR')) draft.resp=v('#aR');
  $$('[data-exn]').forEach(x=>draft.extras[+x.dataset.exn].n=x.value); $$('[data-exp]').forEach(x=>draft.extras[+x.dataset.exp].p=+x.value||0);
}
B.anunciar = ()=>{
  $$('[data-acat]').forEach(b=>b.onclick=()=>{readDraft();draft.cat=b.dataset.acat;draft.sub=Object.keys(CATS[draft.cat].subs)[0];render();});
  $$('[data-asub]').forEach(b=>b.onclick=()=>{readDraft();draft.sub=b.dataset.asub;render();});
  $$('[data-aprof]').forEach(b=>b.onclick=()=>{readDraft();draft.prof=b.dataset.aprof;render();});
  $$('[data-aamen]').forEach(b=>b.onchange=()=>{b.checked?draft.amen.add(b.dataset.aamen):draft.amen.delete(b.dataset.aamen);});
  $('#exadd')&&($('#exadd').onclick=()=>{readDraft();draft.extras.push({n:'',p:0});render();});
  $$('[data-exdel]').forEach(b=>b.onclick=()=>{readDraft();draft.extras.splice(+b.dataset.exdel,1);render();});
  $('#aAc')&&($('#aAc').onchange=()=>{readDraft();render();});
  $('#aF').onchange=e=>{[...e.target.files].slice(0,6).forEach(f=>{const r=new FileReader();r.onload=()=>{draft.fotos.push(r.result);$('#prev').insertAdjacentHTML('beforeend',`<img src="${r.result}" alt="">`);};r.readAsDataURL(f);});};
  $('#fA').onsubmit=e=>{e.preventDefault(); readDraft();
    if(!draft.titulo.trim()) return toast('Dê um título ao anúncio');
    const c=CATS[draft.cat], j=()=>(Math.random()-.5)*0.6, espaco=draft.cat!=='servicos';
    const l=L({id:state.nextId++, cat:draft.cat, sub:draft.sub, prof:draft.cat==='servicos'?draft.prof:undefined, titulo:draft.titulo, bairro:draft.bairro||'Região piloto', x:Math.max(.2,Math.min(3,state.center.x+j())), y:Math.max(.3,Math.min(3.3,state.center.y+j())),
      cap:espaco?draft.cap:1, m2:espaco?draft.m2:null, amen:espaco?[...draft.amen]:[], extras:espaco?draft.extras.filter(e=>e.n.trim()):[], acesso:espaco?draft.acesso:null, resp:draft.resp,
      desc:draft.desc, manual:draft.manual, q:5, cb:5, n:0, sonhos:0, status:'pendente', owner:'eu'});
    if(c.preco==='pacote'){ l.pacotes=draft.p.filter(x=>x.p>0).sort((a,b)=>a.h-b.h); l.porPessoa=draft.porPessoa; if(!l.pacotes.length) return toast('Defina o preço de pelo menos um pacote'); }
    else if(c.preco==='diaria') l.diaria=draft.valor; else if(c.preco==='servico'){ l.servico=draft.valor; l.unidade='/h'; } else { l.valor=draft.valor; l.valorTipo=draft.sub==='aluguel'?'/mês':''; }
    listings.push(l); toast('Enviado para a curadoria'); go('painel');
  };
};

function denunciasBlock(){
  const list=denuncias.filter(d=>stories.some(x=>x.id===d.sid));
  return `<h2>Stories denunciados${list.length?` <span class="coin">${list.length}</span>`:''}</h2>
  ${list.length?`<div class="stack">${list.map(d=>{const x=stories.find(y=>y.id===d.sid), l=listings.find(y=>y.id===x.lid);return `<div class="box listrow" style="align-items:flex-start"><button class="sto" data-sto="d${x.id}" style="width:64px"><span class="ring"><span class="in" style="--c:${col(l)}">${ic(l.sub)}</span></span></button><div>
    <span class="t">${esc(x.autor)} em ${esc(l.titulo)}</span><span class="meta">“${esc(x.legenda||'Sem legenda')}”</span>
    <span class="hint">Denunciado por: ${d.por} · ${esc(d.motivo)} · ${agoTxt(d.quando)}</span>
    <div class="row" style="margin-top:4px"><button class="btn sm" data-rm="${d.id}">Remover story</button><button class="btn sm ghost" data-keep="${d.id}">Manter no ar</button></div></div></div>`;}).join('')}</div>`
  :'<div class="empty">Nenhuma denúncia pendente.</div>'}`;
}
S.curadoria = ()=>{
  const pend=listings.filter(l=>l.status==='pendente');
  return `<div class="eyebrow">Equipe Celus</div><h1>Curadoria</h1><p class="lead">Nada entra no mapa sem passar por aqui, e só a curadoria remove story de cliente.</p>
  ${denunciasBlock()}<h2>Anúncios para aprovar</h2>
  ${pend.length?`<div class="stack">${pend.map(l=>`<div class="box card">${photo(l)}<div class="body"><h3>${esc(l.titulo)}</h3>
    <div class="meta">${CATS[l.cat].nome} · ${esc(subName(l))} · ${priceLabel(l)}${l.m2?` · ${l.m2} m²`:''} · até ${l.cap}</div>
    <p style="font-size:14px">${esc(l.desc)}</p>
    ${l.amen.length?`<div class="chips" style="gap:5px">${l.amen.map(a=>`<span class="tagc">${AMEN[a]}</span>`).join('')}</div>`:''}
    ${l.extras.length?`<p class="meta">Extras: ${l.extras.map(e=>esc(e.n)+' '+brl(e.p)).join(', ')}</p>`:''}
    <div class="manual" style="margin-top:8px">${esc(l.manual)}</div>
    <div class="row" style="margin-top:12px"><button class="btn sm" data-apr="${l.id}">Aprovar</button><button class="btn sm ghost" data-rej="${l.id}">Recusar</button></div></div></div>`).join('')}</div>`
   :`<div class="empty">${masc(64)}<div>Fila vazia. Anuncie algo na aba Anunciar para testar.</div></div>`}`;
};
B.curadoria = ()=>{
  const g={}; stories.forEach(x=>g['d'+x.id]=[x]); bindStories(g);
  $$('[data-rm]').forEach(b=>b.onclick=()=>{const d=denuncias.find(x=>x.id===+b.dataset.rm); stories=stories.filter(x=>x.id!==d.sid); denuncias=denuncias.filter(x=>x.sid!==d.sid); toast('Story removido. Autor e denunciante são avisados'); render();});
  $$('[data-keep]').forEach(b=>b.onclick=()=>{const d=denuncias.find(x=>x.id===+b.dataset.keep); denuncias=denuncias.filter(x=>x.sid!==d.sid); toast('Story mantido no ar'); render();});
  $$('[data-apr]').forEach(b=>b.onclick=()=>{listings.find(l=>l.id===+b.dataset.apr).status='aprovado';toast('Publicado no mapa');render();});
  $$('[data-rej]').forEach(b=>b.onclick=()=>{listings=listings.filter(l=>l.id!==+b.dataset.rej);toast('Anúncio recusado');render();});
};

render();
</script>
